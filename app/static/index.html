<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice Decision Agent</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .spin{animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body class="bg-slate-100 text-slate-900">
<main class="max-w-6xl mx-auto px-4 py-6">
  <header class="flex flex-wrap items-center justify-between gap-3 mb-5">
    <div>
      <h1 class="text-2xl font-bold tracking-tight">Invoice Decision Agent</h1>
      <p class="text-sm text-slate-500">LLM reads. Rules decide. Every stage stays visible.</p>
    </div>
    <div class="flex items-center gap-2">
      <nav id="tabs" class="flex bg-white rounded-lg p-1 shadow-sm"></nav>
      <button id="resetBtn" class="bg-slate-900 text-white text-sm px-3 py-2 rounded-lg">Reset demo data</button>
    </div>
  </header>

  <section id="process">
    <div class="bg-white rounded-xl shadow-sm p-4 mb-4 flex flex-wrap items-end gap-3">
      <div id="drop" class="flex-1 min-w-[240px] border-2 border-dashed border-slate-300 rounded-lg px-4 py-3 text-sm text-slate-600">
        Drop a PDF here, or
        <button id="browse" class="text-blue-700 font-medium">browse</button>
        <input id="file" type="file" accept="application/pdf,.pdf" class="hidden">
        <div id="fileName" class="text-slate-800 mt-1"></div>
      </div>
      <button id="uploadBtn" class="bg-blue-700 text-white px-4 py-2 rounded-lg text-sm">Run upload</button>
      <div class="flex items-center gap-2">
        <select id="samples" class="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white"></select>
        <button id="sampleBtn" class="bg-blue-700 text-white px-4 py-2 rounded-lg text-sm">Run sample</button>
      </div>
    </div>
    <div class="grid lg:grid-cols-2 gap-4">
      <div class="bg-white rounded-xl shadow-sm p-4">
        <h2 class="font-semibold mb-3">Live run</h2>
        <div id="steps"></div>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-4">
        <div class="flex items-center justify-between mb-2">
          <h2 class="font-semibold">Invoice</h2>
          <span id="engine" class="hidden text-xs uppercase tracking-wide bg-slate-900 text-white px-2 py-1 rounded"></span>
        </div>
        <iframe id="preview" class="w-full h-72 border border-slate-200 rounded-lg bg-slate-50" title="Invoice PDF"></iframe>
        <div id="fields" class="mt-3 text-sm"></div>
      </div>
    </div>
    <div id="decision" class="bg-white rounded-xl shadow-sm p-5 mt-4"></div>
  </section>

  <section id="dashboard" class="hidden">
    <div id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4"></div>
    <div id="bars" class="bg-white rounded-xl shadow-sm p-4 mb-4"></div>
    <div class="flex flex-wrap gap-2 mb-3" id="filters"></div>
    <div class="bg-white rounded-xl shadow-sm overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="text-left text-slate-500 border-b"><tr><th class="p-3">ID</th><th>File</th><th>Status</th><th>Reasons</th><th>PO</th><th>Amount</th><th>When</th></tr></thead>
        <tbody id="runs"></tbody>
      </table>
    </div>
    <div id="replay" class="bg-white rounded-xl shadow-sm p-4 mt-4 hidden"></div>
    <div class="grid lg:grid-cols-2 gap-4 mt-4">
      <div class="bg-white rounded-xl shadow-sm p-4 overflow-x-auto">
        <h2 class="font-semibold mb-2">PO ledger</h2>
        <table class="w-full text-sm"><thead class="text-left text-slate-500"><tr><th class="py-1">PO</th><th>Vendor</th><th>Total</th><th>Billed</th><th>Remaining</th><th>Basis</th></tr></thead><tbody id="pos"></tbody></table>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-4 overflow-x-auto">
        <h2 class="font-semibold mb-2">Vendor master</h2>
        <table class="w-full text-sm"><thead class="text-left text-slate-500"><tr><th class="py-1">ID</th><th>Name</th><th>Status</th><th>GSTIN</th><th>Tolerance</th></tr></thead><tbody id="vendors"></tbody></table>
      </div>
    </div>
  </section>

  <section id="settings" class="hidden">
    <div id="settingsBody" class="grid lg:grid-cols-2 gap-4"></div>
  </section>
</main>
<script>
const STAGES=["ingest","extract","confidence_gate","vendor_check","po_match","duplicate_check","financial_validation","decision"];
const LABEL={ingest:"Ingest",extract:"Extract",confidence_gate:"Confidence gate",vendor_check:"Vendor check",po_match:"PO match",duplicate_check:"Duplicate check",financial_validation:"Financial validation",decision:"Decision"};
const FILTERS=["ALL","APPROVED","NEEDS_REVIEW","ON_HOLD","REJECTED","FAILED","RUNNING"];
let timer, current, filter="ALL", runsCache=[];
const $=(id)=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function j(u,o){const r=await fetch(u,o); if(!r.ok) throw new Error(await r.text()); return r.json()}
function money(n){return n==null||n===""?"—":"INR "+Number(n).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function badge(status){
  const map={APPROVED:"bg-green-100 text-green-800",NEEDS_REVIEW:"bg-amber-100 text-amber-800",ON_HOLD:"bg-amber-100 text-amber-900",REJECTED:"bg-red-100 text-red-800",RUNNING:"bg-slate-200 text-slate-700",FAILED:"bg-red-900 text-white"};
  return `<span class="inline-block px-2 py-0.5 rounded text-xs font-semibold ${map[status]||"bg-slate-200"}">${esc(status||"—")}</span>`;
}
function parse(detail){try{return typeof detail==="string"?JSON.parse(detail):detail||{}}catch(e){return {}}}
function summary(stage,d){
  if(d.reason && !d.result && !d.status) return "not reached ("+d.reason+")";
  if(stage==="ingest") return d.hash?"SHA-256 "+d.hash:"";
  if(stage==="extract") return [d.vendor_name,d.vendor_tax_id].filter(Boolean).join(" · ")||"no fields";
  if(stage==="confidence_gate"){const f=(d.missing||[]).concat(d.low||[]);return f.length?"unreadable: "+f.join(", "):"required fields readable"}
  if(stage==="vendor_check") return d.result==="rejected"?"not approved":d.result==="bank_changed"?"bank details changed":(d.vendor||"")+(d.score!=null?" · score "+d.score:"");
  if(stage==="po_match") return d.po?d.po+" · "+d.method:(d.result||d.method||"");
  if(stage==="duplicate_check") return d.result==="clear"?"no duplicate":d.result==="exact"?"exact duplicate of run "+d.earlier_run:d.result==="fuzzy"?"suspected duplicate of run "+d.earlier_run:(d.result||"");
  if(stage==="financial_validation") return d.result?(d.result+" · "+d.basis+" · variance "+(d.variance_pct==null?"n/a":d.variance_pct+"%")):"";
  if(stage==="decision") return d.status||"";
  return "";
}
function icon(state,status){
  if(state==="running") return `<span class="spin inline-block w-4 h-4 border-2 border-slate-300 border-t-blue-600 rounded-full"></span>`;
  if(state==="skipped") return `<span class="inline-flex w-4 h-4 items-center justify-center text-slate-400">–</span>`;
  if(state==="done" && (status==="REJECTED"||status==="FAILED")) return `<span class="inline-flex w-4 h-4 items-center justify-center rounded-full bg-red-600 text-white text-xs">×</span>`;
  if(state==="done" && (status==="NEEDS_REVIEW"||status==="ON_HOLD")) return `<span class="inline-flex w-4 h-4 items-center justify-center rounded-full bg-amber-500 text-white text-xs">!</span>`;
  if(state==="done") return `<span class="inline-flex w-4 h-4 items-center justify-center rounded-full bg-green-600 text-white text-xs">✓</span>`;
  return `<span class="inline-block w-4 h-4 rounded-full border-2 border-slate-300"></span>`;
}
function renderSteps(target,events){
  const latest={};
  (events||[]).forEach(e=>{latest[e.stage]=e});
  target.innerHTML=STAGES.map(stage=>{
    const e=latest[stage];
    const d=e?parse(e.detail):{};
    const state=e?e.state:"pending";
    const status=stage==="decision"?d.status:d.result==="rejected"||d.result==="hard"||d.result==="exact"?"REJECTED":d.result==="bank_changed"||d.result==="fuzzy"||d.result==="soft"?"NEEDS_REVIEW":d.result==="not_found"?"ON_HOLD":null;
    return `<button type="button" data-stage="${stage}" class="w-full text-left flex gap-3 py-2 border-b border-slate-100">
      <span class="mt-0.5">${icon(state,status)}</span>
      <span class="flex-1">
        <span class="font-medium">${LABEL[stage]}</span>
        <span class="text-slate-400 text-xs ml-2">${state}${e&&e.ms?` · ${e.ms} ms`:""}</span>
        <span class="block text-sm text-slate-600">${esc(summary(stage,d))}</span>
        <pre class="detail hidden mt-2 text-xs bg-slate-50 p-2 rounded overflow-x-auto">${esc(e?JSON.stringify(d,null,2):"")}</pre>
      </span>
    </button>`;
  }).join("");
  target.querySelectorAll("button").forEach(b=>b.onclick=()=>b.querySelector(".detail").classList.toggle("hidden"));
}
function renderFields(x){
  if(!x){$("fields").innerHTML=`<p class="text-slate-400">Extracted fields appear here.</p>`;$("engine").classList.add("hidden");return}
  $("engine").textContent=x.engine||"offline";$("engine").classList.remove("hidden");
  const rows=[["Vendor",x.vendor_name],["GSTIN",x.vendor_tax_id],["Bank account",x.vendor_bank_account],["Invoice no",x.invoice_number],["Invoice date",x.invoice_date],["Due date",x.due_date],["PO",x.po_reference],["Subtotal",x.subtotal],["GST amount",x.tax_amount],["Total",x.total],["Quality",x.document_quality]];
  $("fields").innerHTML=`<table class="w-full">${rows.map(([k,v])=>`<tr class="border-b border-slate-100"><td class="py-1 text-slate-500 w-32">${k}</td><td class="py-1 font-medium">${esc(v??"—")}</td></tr>`).join("")}</table>`;
}
function renderDecision(target,run){
  if(!run){target.innerHTML=`<p class="text-slate-400">Run an invoice to see the decision.</p>`;return}
  let codes=[]; try{codes=JSON.parse(run.reason_codes||"[]")}catch(e){}
  const actions=["NEEDS_REVIEW","ON_HOLD"].includes(run.status);
  target.innerHTML=`<div class="flex flex-wrap items-center gap-3 mb-3"><span class="text-lg">${badge(run.status)}</span>${codes.map(c=>`<span class="text-xs bg-slate-100 px-2 py-1 rounded">${esc(c)}</span>`).join("")}</div>
    <p class="leading-relaxed">${esc(run.explanation||"")}</p>
    ${run.email_draft?`<div class="mt-4 bg-amber-50 border border-amber-200 rounded-lg p-3"><div class="flex justify-between items-center mb-1"><span class="text-sm font-medium">Draft to vendor</span><button id="copyEmail" class="text-sm text-blue-700">Copy</button></div><p class="text-sm">${esc(run.email_draft)}</p></div>`:""}
    ${actions?`<div class="flex flex-wrap gap-2 mt-4"><button data-act="approve" class="bg-green-700 text-white px-3 py-2 rounded text-sm">Approve</button><button data-act="reject" class="bg-red-700 text-white px-3 py-2 rounded text-sm">Reject</button><button data-act="request_info" class="bg-amber-600 text-white px-3 py-2 rounded text-sm">Request info</button></div>`:""}`;
  const copy=$("copyEmail"); if(copy) copy.onclick=()=>navigator.clipboard.writeText(run.email_draft||"");
  target.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act(b.dataset.act));
}
async function act(action){
  await j(`/api/runs/${current}/action`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action,note:""})});
  const data=await j("/api/runs/"+current);
  renderDecision($("decision"),data.run);
}
function tab(name){
  ["process","dashboard","settings"].forEach(id=>$(id).classList.toggle("hidden",id!==name));
  [...$("tabs").children].forEach(b=>b.className="px-3 py-1.5 rounded-md text-sm "+(b.dataset.tab===name?"bg-slate-900 text-white":"text-slate-600"));
  if(name==="dashboard") loadDash();
  if(name==="settings") loadSettings();
}
async function loadSamples(){
  const a=await j("/api/samples");
  $("samples").innerHTML=a.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");
}
function start(id){
  current=id; clearInterval(timer);
  $("preview").src="/api/runs/"+id+"/file";
  renderFields(null); renderSteps($("steps"),[]);
  $("decision").innerHTML=`<p class="text-slate-500">Processing…</p>`;
  let last=0, seenDecision=false;
  timer=setInterval(async()=>{
    try{
      const events=await j(`/api/runs/${id}/events?after=${last}`);
      if(!events.length && !seenDecision) return;
      const all=await j("/api/runs/"+id);
      events.forEach(e=>{last=e.id});
      renderSteps($("steps"),all.events);
      const extracted=parse(all.run.extracted);
      if(extracted && extracted.engine) renderFields(extracted);
      else {
        const hit=[...all.events].reverse().find(e=>e.stage==="extract"&&e.state==="done");
        if(hit) renderFields(parse(hit.detail));
      }
      const done=all.events.some(e=>e.stage==="decision"&&e.state==="done");
      if(done){seenDecision=true; renderDecision($("decision"),all.run); clearInterval(timer)}
    }catch(err){$("decision").innerHTML=`<p class="text-red-700">${esc(err.message)}</p>`; clearInterval(timer)}
  },400);
}
async function upload(){
  const f=$("file").files[0]; if(!f) return;
  const body=new FormData(); body.append("file",f);
  start((await j("/api/runs",{method:"POST",body})).id);
}
async function sample(){start((await j("/api/runs/sample",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:$("samples").value})})).id)}
function drawBars(by){
  const keys=["APPROVED","NEEDS_REVIEW","ON_HOLD","REJECTED","FAILED","RUNNING"];
  const max=Math.max(1,...keys.map(k=>by[k]||0));
  const color={APPROVED:"bg-green-600",NEEDS_REVIEW:"bg-amber-500",ON_HOLD:"bg-amber-300",REJECTED:"bg-red-600",FAILED:"bg-red-900",RUNNING:"bg-slate-400"};
  $("bars").innerHTML=`<h2 class="font-semibold mb-3">Status mix</h2><div class="space-y-2">${keys.map(k=>`<div class="flex items-center gap-3 text-sm"><span class="w-32 text-slate-500">${k.replace("_"," ")}</span><span class="h-3 ${color[k]} rounded" style="width:${((by[k]||0)/max)*100}%"></span><span>${by[k]||0}</span></div>`).join("")}</div>`;
}
function showRuns(){
  const rows=runsCache.filter(r=>filter==="ALL"||r.status===filter);
  $("runs").innerHTML=rows.length?rows.map(r=>{
    let codes=[]; try{codes=JSON.parse(r.reason_codes||"[]")}catch(e){}
    return `<tr data-id="${r.id}" class="border-b hover:bg-slate-50 cursor-pointer"><td class="p-3">${r.id}</td><td>${esc(r.filename)}</td><td>${badge(r.status)}</td><td class="text-xs">${esc(codes.join(", "))}</td><td>${esc(r.po_number||"—")}</td><td>${money(r.amount)}</td><td class="text-slate-500">${esc((r.created_at||"").replace("T"," ").slice(0,19))}</td></tr>`;
  }).join(""):`<tr><td class="p-4 text-slate-400" colspan="7">No runs for this filter.</td></tr>`;
  $("runs").querySelectorAll("tr[data-id]").forEach(tr=>tr.onclick=()=>replay(tr.dataset.id));
}
async function replay(id){
  const data=await j("/api/runs/"+id);
  $("replay").classList.remove("hidden");
  $("replay").innerHTML=`<h2 class="font-semibold mb-2">Run ${id} · ${esc(data.run.filename)}</h2><div id="replaySteps"></div><div id="replayDecision" class="mt-3"></div>`;
  renderSteps($("replaySteps"),data.events);
  renderDecision($("replayDecision"),data.run);
  $("replay").scrollIntoView({behavior:"smooth",block:"nearest"});
}
async function loadDash(){
  const [s,r,p,v]=await Promise.all([j("/api/stats"),j("/api/runs"),j("/api/pos"),j("/api/vendors")]);
  runsCache=r;
  const by=s.by_status||{};
  const pct=s.total?((by.APPROVED||0)/s.total*100).toFixed(1):"0.0";
  const tiles=[["Runs",s.total],["Approved %",pct],["On hold",by.ON_HOLD||0],["Needs review",by.NEEDS_REVIEW||0],["Rejected",by.REJECTED||0],["Approved value",money(s.approved_value)],["STP rate",s.stp_rate.toFixed(1)+"%"],["Avg time",s.avg_ms+" ms"]];
  $("stats").innerHTML=tiles.map(([k,val])=>`<div class="bg-white rounded-xl shadow-sm p-3"><div class="text-xs text-slate-500">${k}</div><div class="text-lg font-semibold mt-1">${val}</div></div>`).join("");
  drawBars(by);
  $("filters").innerHTML=FILTERS.map(f=>`<button data-f="${f}" class="px-3 py-1 rounded-full text-xs ${f===filter?"bg-slate-900 text-white":"bg-white text-slate-600"}">${f.replaceAll("_"," ")}</button>`).join("");
  $("filters").querySelectorAll("button").forEach(b=>b.onclick=()=>{filter=b.dataset.f;showRuns();loadDash()});
  showRuns();
  $("pos").innerHTML=p.map(row=>`<tr class="border-t"><td class="py-1">${esc(row.po_number)}</td><td>${esc(row.vendor_id)}</td><td>${money(row.total)}</td><td>${money(row.billed)}</td><td>${money(row.remaining)}</td><td>${esc(row.basis)}</td></tr>`).join("");
  $("vendors").innerHTML=v.map(row=>`<tr class="border-t"><td class="py-1">${esc(row.id)}</td><td>${esc(row.name)}</td><td>${badge(row.status==="approved"?"APPROVED":"REJECTED")}</td><td>${esc(row.tax_id)}</td><td>${row.tolerance_pct}% / ${money(row.tolerance_abs)}</td></tr>`).join("");
}
async function loadSettings(){
  const data=await j("/api/policy");
  const policy=(data.policy||[]).map(r=>`<tr class="border-t"><td class="py-1">${esc(r.key)}</td><td>${esc(r.value)}</td></tr>`).join("");
  const vendors=(data.vendors||[]).map(r=>`<tr class="border-t"><td class="py-1">${esc(r.id)}</td><td>${esc(r.name)}</td><td>${esc(r.status)}</td><td>${r.tolerance_pct}% / ${money(r.tolerance_abs)}</td></tr>`).join("");
  $("settingsBody").innerHTML=`<div class="bg-white rounded-xl shadow-sm p-4"><h2 class="font-semibold mb-2">Extraction engine</h2><p class="mb-4">${badge(data.engine==="gemini"?"APPROVED":"RUNNING")} <span class="ml-2 text-sm">${data.engine==="gemini"?"Gemini key is set":"Offline parser (no Gemini key)"}</span></p><h2 class="font-semibold mb-2">Policy</h2><table class="w-full text-sm"><tbody>${policy}</tbody></table><h2 class="font-semibold mt-4 mb-2">Per-vendor tolerance</h2><table class="w-full text-sm"><tbody>${vendors}</tbody></table></div><div class="bg-white rounded-xl shadow-sm p-4"><h2 class="font-semibold mb-2">Assumptions</h2><ol class="list-decimal pl-5 space-y-2 text-sm leading-relaxed">${(data.assumptions||[]).map(a=>`<li>${esc(a)}</li>`).join("")}</ol></div>`;
}
$("tabs").innerHTML=["process","dashboard","settings"].map(t=>`<button data-tab="${t}" class="px-3 py-1.5 rounded-md text-sm">${t[0].toUpperCase()+t.slice(1)}</button>`).join("");
$("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>tab(b.dataset.tab));
$("browse").onclick=()=>$("file").click();
$("file").onchange=()=>{$("fileName").textContent=$("file").files[0]?$("file").files[0].name:""};
$("uploadBtn").onclick=()=>upload().catch(e=>alert(e.message));
$("sampleBtn").onclick=()=>sample().catch(e=>alert(e.message));
$("resetBtn").onclick=async()=>{if(!confirm("Clear runs and restore the PO ledger?"))return; await j("/api/reset",{method:"POST"}); if(!$("dashboard").classList.contains("hidden")) loadDash(); $("decision").innerHTML=`<p class="text-slate-500">Demo data reset.</p>`; renderSteps($("steps"),[]); renderFields(null)};
const drop=$("drop");
["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("border-blue-500","bg-blue-50")}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("border-blue-500","bg-blue-50")}));
drop.addEventListener("drop",e=>{const f=e.dataTransfer.files[0]; if(!f) return; const dt=new DataTransfer(); dt.items.add(f); $("file").files=dt.files; $("fileName").textContent=f.name});
renderSteps($("steps"),[]); renderFields(null); renderDecision($("decision"),null); tab("process"); loadSamples().catch(e=>{$("samples").innerHTML=`<option>No samples</option>`});
</script>
</body>
</html>
