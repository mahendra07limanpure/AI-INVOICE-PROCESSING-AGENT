<!doctype html><html><head><meta charset="utf-8"><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-100 text-slate-900"><main class="max-w-6xl mx-auto p-6"><header class="flex justify-between mb-6"><h1 class="text-2xl font-bold">Invoice Decision Agent</h1><button onclick="reset()" class="bg-red-700 text-white px-3 py-2 rounded">Reset demo data</button></header><nav class="flex gap-2 mb-4"><button onclick="tab('process')" class="px-4 py-2 bg-white rounded">Process</button><button onclick="tab('dashboard')" class="px-4 py-2 bg-white rounded">Dashboard</button><button onclick="tab('settings')" class="px-4 py-2 bg-white rounded">Settings</button></nav><section id="process" class="grid md:grid-cols-2 gap-4"><div class="bg-white p-4 rounded"><input id="file" type="file" accept=".pdf"><button onclick="upload()" class="bg-blue-600 text-white px-3 py-2 rounded ml-2">Run</button><div class="mt-3"><select id="samples" class="border p-2"></select><button onclick="sample()" class="bg-blue-600 text-white px-3 py-2 rounded ml-2">Run sample</button></div><div id="steps" class="mt-5"></div></div><div class="bg-white p-4 rounded"><iframe id="preview" class="w-full h-72"></iframe><pre id="decision" class="whitespace-pre-wrap mt-3"></pre></div></section><section id="dashboard" class="hidden bg-white p-4 rounded"><div id="stats" class="grid grid-cols-4 gap-3 mb-4"></div><table class="w-full text-sm"><tbody id="runs"></tbody></table><h2 class="font-bold mt-5">PO ledger</h2><pre id="pos"></pre></section><section id="settings" class="hidden bg-white p-4 rounded"><pre id="settingsText"></pre></section></main><script>
const stages=['ingest','extract','confidence_gate','vendor_check','po_match','duplicate_check','financial_validation','decision'];let timer;
async function j(u,o){return (await fetch(u,o)).json()} function tab(x){['process','dashboard','settings'].forEach(y=>document.getElementById(y).classList.toggle('hidden',y!==x));if(x==='dashboard')loadDash();if(x==='settings')loadSettings()}
async function loadSamples(){let a=await j('/api/samples');samples.innerHTML=a.map(x=>`<option>${x}</option>`).join('')} async function upload(){let f=file.files[0];if(!f)return;let d=new FormData;d.append('file',f);start((await j('/api/runs',{method:'POST',body:d})).id)} async function sample(){start((await j('/api/runs/sample',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:samples.value})})).id)}
function start(id){preview.src='/api/runs/'+id+'/file';steps.innerHTML=stages.map(x=>`<div id="s-${x}" class="p-2 border-b">${x} <span>pending</span></div>`).join('');let last=0;clearInterval(timer);timer=setInterval(async()=>{let es=await j(`/api/runs/${id}/events?after=${last}`);es.forEach(e=>{last=e.id;let q=document.querySelector('#s-'+e.stage);if(q)q.innerHTML=e.stage+' <span class="text-green-700">'+e.state+'</span> <small>'+e.detail+'</small>'});let r=await j('/api/runs/'+id);if(r.run.status!=='RUNNING'){decision.textContent=JSON.stringify(r.run,null,2);clearInterval(timer)}},400)}
async function loadDash(){let [s,r,p]=await Promise.all([j('/api/stats'),j('/api/runs'),j('/api/pos')]);stats.innerHTML=Object.entries({Total:s.total,Approved:s.by_status?.APPROVED||0,'Approved value':s.approved_value,'STP %':s.stp_rate.toFixed(1)}).map(x=>`<div class="p-3 bg-slate-100 rounded"><b>${x[0]}</b><br>${x[1]}</div>`).join('');runs.innerHTML='<tr><th>ID</th><th>File</th><th>Status</th><th>PO</th><th>Amount</th></tr>'+r.map(x=>`<tr><td>${x.id}</td><td>${x.filename}</td><td>${x.status}</td><td>${x.po_number||''}</td><td>${x.amount||''}</td></tr>`).join('');pos.textContent=JSON.stringify(p,null,2)} async function loadSettings(){settingsText.textContent=JSON.stringify(await j('/api/policy'),null,2)} async function reset(){await j('/api/reset',{method:'POST'});loadDash()}loadSamples();
</script></body></html>
